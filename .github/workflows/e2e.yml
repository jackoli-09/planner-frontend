name: e2e
on:
  push:
  pull_request:
jobs:
  offline-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planner
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/planner
      BACKEND_DIR: ${{ github.workspace }}/planner-backend
      CHART_JS: ${{ github.workspace }}/e2edeps/node_modules/chart.js/dist/chart.umd.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jackoli-09/planner-backend
          path: planner-backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r planner-backend/requirements.txt pytest==8.3.3 playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: mkdir -p e2edeps && cd e2edeps && npm i --silent chart.js@4.4.1
      - run: pytest -q tests/e2e
